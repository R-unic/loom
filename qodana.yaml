#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify IDE code to run analysis without container (Applied in CI/CD pipeline)
ide: QDNET

#Specify inspection profile for code analysis
profile:
  name: qodana.recommended

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

# Disable inspections
#
# Every entry here is a place where "nobody reads this" is a fact about the analyzer rather than about the
# code: something outside C# does the reading. Without them the unused-member inspections report ~140 hits
# that must all be ignored, which is the same as reporting none - the real ones are not findable in the pile.
exclude:
  # A syntax node owns every token it was parsed from, named, whether or not a stage happens to read it
  # today. That is what makes the tree the source of truth about the text - the language server reads spans
  # off them, and a formatter or a rewriter would read the rest. Roslyn's syntax nodes expose their tokens
  # for the same reason; deleting the ones with no reader yet would make the tree lossy to save nothing.
  #
  # Bound by name at runtime, never constructed or assigned in code Qodana can see: Tomlyn's generated
  # TomlSerializerContext writes the config properties, and System.Text.Json writes the API dump ones.
  - name: UnusedMember.Global
    paths:
      - Loom.Core/Parsing/AST
      - Loom.TypeGenerator/ApiTypes
  - name: UnusedAutoPropertyAccessor.Global
    paths:
      - Loom.Core/Parsing/AST
      - Loom.Config
      - Loom.TypeGenerator/ApiTypes
  - name: ClassNeverInstantiated.Global
    paths:
      - Loom.TypeGenerator/ApiTypes
  - name: PropertyCanBeMadeInitOnly.Global
    paths:
      - Loom.TypeGenerator/ApiTypes

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
failureConditions:
  severityThresholds:
    high: 60
    critical: 5
  testCoverageThresholds:
    fresh: 70
    total: 50
