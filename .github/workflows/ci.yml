name: CI
on:
  pull_request:
  push:
    branches: ["master"]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  # Every OS the compiler is published for, because the bugs this catches are the ones that only
  # exist on one of them: a drive letter that round-trips in a different case, a path separator, a
  # filesystem that compares names case-insensitively. Coverage is collected on one leg rather than
  # all three - it is the same code either way, and Coveralls takes a single submission.
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test -c Release

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

      - name: Configure PATH for tools
        if: matrix.os == 'ubuntu-latest'
        run: echo "/home/runner/.dotnet/tools" >> $GITHUB_PATH

      - name: Run tests and generate coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test -c Release --collect:"XPlat Code Coverage" --settings Loom.Testing/coverlet.runsettings

      - name: Convert coverage to LCOV
        if: matrix.os == 'ubuntu-latest'
        run: |
          reportgenerator -reports:"**/TestResults/**/*.cobertura.xml" -targetdir:"coverage" -reporttypes:lcov
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # One check whose name does not move when the matrix does. A required status check is named, so
  # spreading the suite across three legs would otherwise retire the name branch protection asks for
  # and leave every pull request waiting on a check that no longer reports.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: suite
    if: always()
    steps:
      - name: Check the suite passed on every OS
        run: |
          if [ "${{ needs.suite.result }}" != "success" ]; then
            echo "the suite did not pass on every OS: ${{ needs.suite.result }}"
            exit 1
          fi
